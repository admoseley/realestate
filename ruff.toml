# Ruff lint configuration for the analysis scripts (repo root) and the FastAPI
# backend (web/backend). The frontend is linted separately with eslint.
target-version = "py311"
extend-exclude = ["web/frontend"]

[lint]
# Pyflakes (real bugs: undefined names, unused imports/variables) plus the
# pycodestyle error classes ruff enables by default.
select = ["E4", "E7", "E9", "F"]

# Style rules the existing code deliberately doesn't follow. They're ignored
# rather than "fixed" so CI can be introduced without reformatting business
# logic; pyflakes still catches the bugs that matter.
ignore = [
  "E701", # aligned one-line `if cond: stmt` blocks are used throughout the analyzers
  "E731", # short formatting lambdas (fmt/fmtp) in the email HTML builders
  "E741", # single-letter variable names in math-heavy analysis code
]

[lint.per-file-ignores]
# main.py loads the .env file before importing modules that read settings at
# import time, so those imports can't be at the top of the file.
"web/backend/main.py" = ["E402"]
