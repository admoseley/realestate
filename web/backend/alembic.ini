# Alembic configuration for the backend database.
#
# Run from web/backend:
#   alembic upgrade head                                  apply migrations
#   alembic revision --autogenerate -m "describe change"  after editing models
#   alembic check                                         fail if models and migrations differ
#
# The app also applies migrations automatically at startup (RUN_MIGRATIONS).
# The database connection comes from database.py (SQLite locally, Azure SQL in
# Azure), so there is no sqlalchemy.url here.

[alembic]
script_location = migrations
prepend_sys_path = .
